<!DOCTYPE html>
<html>
<head>
  <title>Form Autofill</title>
  <style>
    body { font-family: sans-serif; min-width: 240px; }
    button { width: 100%; margin: 10px 0; }
    #profiles { margin-bottom: 10px; }
    #profiles-list { max-height: 120px; overflow-y: auto; margin-bottom: 6px; }
    .profile-item { display: flex; align-items: center; margin-bottom: 4px; padding: 2px 0; }
    .profile-item span { flex: 1; cursor: pointer; padding: 2px 6px; border-radius: 3px; transition: background 0.2s; }
    .profile-item.selected span { font-weight: bold; color: #0077cc; background: #e6f2fa; }
    .profile-item span:hover { background: #f0f0f0; }
    .profile-item button { width: 26px; height: 26px; margin-left: 4px; border: none; background: none; cursor: pointer; font-size: 18px; line-height: 1; color: #c00; border-radius: 3px; transition: background 0.2s; }
    .profile-item button:hover { background: #ffeaea; }
    #new-profile { width: 68%; margin-right: 2%; box-sizing: border-box; }
    #add-profile { width: 30%; }
  </style>
</head>
<body>
  <h3>Form Autofill</h3>
  <div id="profiles">
    <b>Profiles:</b>
    <div id="profiles-list"></div>
    <input type="text" id="new-profile" placeholder="New profile name">
    <button id="add-profile">Add</button>
  </div>
  <button id="autofillBtn">Autofill Form</button>
  <div id="unmatched-fields" style="margin-top:12px;"></div>
  <div id="profile-forms" style="margin-top:16px;"></div>
  <a href="options.html" target="_blank">Manage Data</a>
  <script src="popup.js"></script>
</body>
</html>
